<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACADEMIC PLANNER // P3R</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --blue-deep: #001133;
  --blue-mid: #003399;
  --blue-bright: #0055ff;
  --blue-cyan: #00ccff;
  --blue-glow: #33aaff;
  --white: #e8f4ff;
  --grey: #8899bb;
  --dark: #000820;
  --accent-red: #ff3344;
  --accent-pink: #ff88aa;
  --card-bg: rgba(0,17,51,0.85);
  --border: rgba(0,170,255,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Rajdhani',sans-serif; background:var(--dark); color:var(--white); min-height:100vh; overflow-x:hidden; }
.bg-layer { position:fixed; inset:0; z-index:0; background:radial-gradient(ellipse 80% 60% at 20% 80%,rgba(0,50,200,0.4) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 20%,rgba(0,100,255,0.2) 0%,transparent 50%),linear-gradient(160deg,#000820 0%,#001133 40%,#000a22 100%); }
.bg-img { position:fixed; inset:0; z-index:1; background-size:cover; background-position:center; opacity:0.12; transition:opacity 0.8s; }
.scanlines { position:fixed; inset:0; z-index:3; pointer-events:none; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px); }
.app { position:relative; z-index:10; min-height:100vh; display:flex; flex-direction:column; }
header { padding:0 2rem; border-bottom:1px solid var(--border); background:rgba(0,8,32,0.92); backdrop-filter:blur(12px); position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:2rem; flex-wrap:wrap; }
.logo-block { display:flex; align-items:center; gap:1rem; padding:0.8rem 2rem 0.8rem 0; border-right:1px solid var(--border); }
.logo-icon { width:42px; height:42px; background:var(--blue-bright); clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); display:flex; align-items:center; justify-content:center; font-family:'Orbitron',sans-serif; font-size:12px; font-weight:900; color:#fff; animation:pulse-hex 3s ease-in-out infinite; }
@keyframes pulse-hex { 0%,100%{box-shadow:0 0 10px var(--blue-bright);} 50%{box-shadow:0 0 30px var(--blue-cyan),0 0 60px rgba(0,170,255,0.3);} }
.logo-text { font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:3px; color:var(--blue-cyan); text-transform:uppercase; line-height:1.4; }
.logo-text span { display:block; color:var(--grey); font-size:9px; letter-spacing:4px; }
.main-nav { display:flex; gap:0.3rem; }
.main-nav button { background:none; border:none; color:var(--grey); font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:600; letter-spacing:2px; text-transform:uppercase; cursor:pointer; padding:0.6rem 1rem; position:relative; transition:color 0.2s; }
.main-nav button::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:var(--blue-cyan); transform:scaleX(0); transition:transform 0.2s; }
.main-nav button:hover { color:var(--white); }
.main-nav button.active { color:var(--blue-cyan); }
.main-nav button.active::after { transform:scaleX(1); }
.category-bar { background:rgba(0,17,51,0.95); border-bottom:1px solid var(--border); padding:0 2rem; display:flex; gap:0; align-items:center; overflow-x:auto; scrollbar-width:none; }
.category-bar::-webkit-scrollbar { display:none; }
.cat-label { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--grey); letter-spacing:2px; margin-right:1rem; white-space:nowrap; }
.cat-btn { background:none; border:none; cursor:pointer; font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; padding:0.7rem 1.2rem; border-right:1px solid rgba(0,170,255,0.1); transition:all 0.2s; white-space:nowrap; position:relative; }
.cat-btn.avaliativa { color:#ffcc00; }
.cat-btn.comum { color:var(--blue-cyan); }
.cat-btn.apresentacao { color:var(--accent-pink); }
.cat-btn.all-btn { color:var(--grey); }
.cat-btn:hover,.cat-btn.active { background:rgba(0,170,255,0.1); }
.cat-btn .cnt { position:absolute; top:4px; right:4px; font-size:8px; font-family:'Share Tech Mono',monospace; background:rgba(0,170,255,0.3); padding:1px 4px; border-radius:2px; }
main { flex:1; padding:2rem; max-width:1400px; width:100%; margin:0 auto; }
.page-header { display:flex; align-items:flex-end; gap:1.5rem; margin-bottom:2rem; padding-bottom:1rem; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.page-title { font-family:'Orbitron',sans-serif; font-size:26px; font-weight:900; letter-spacing:4px; text-transform:uppercase; background:linear-gradient(90deg,var(--blue-cyan),var(--white)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.page-title-sub { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--grey); letter-spacing:3px; margin-bottom:4px; }
.page-date { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--grey); margin-left:auto; letter-spacing:2px; }
.stats-bar { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:2rem; }
.stat-card { background:var(--card-bg); border:1px solid var(--border); padding:1rem 1.5rem; backdrop-filter:blur(8px); clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px)); transition:transform 0.2s,border-color 0.2s; }
.stat-card:hover { transform:translateY(-2px); border-color:var(--blue-glow); }
.stat-num { font-family:'Orbitron',sans-serif; font-size:28px; font-weight:900; color:var(--blue-cyan); line-height:1; }
.stat-label { font-size:11px; letter-spacing:2px; color:var(--grey); text-transform:uppercase; margin-top:4px; }
.subjects-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:1.5rem; }
.subject-card { background:var(--card-bg); border:1px solid var(--border); backdrop-filter:blur(12px); overflow:hidden; clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px)); transition:transform 0.3s,border-color 0.3s,box-shadow 0.3s; animation:card-in 0.4s ease both; }
@keyframes card-in { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
.subject-card:hover { transform:translateY(-4px); border-color:rgba(0,200,255,0.5); box-shadow:0 8px 32px rgba(0,100,255,0.2); }
.subject-header { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.5rem; border-bottom:1px solid var(--border); background:linear-gradient(90deg,rgba(0,50,150,0.5),transparent); }
.subject-name { font-family:'Orbitron',sans-serif; font-size:12px; font-weight:700; letter-spacing:2px; color:var(--white); }
.subject-code { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--blue-cyan); letter-spacing:2px; }
.subject-count { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--grey); background:rgba(0,170,255,0.1); padding:2px 8px; border:1px solid rgba(0,170,255,0.2); }
.subject-body { padding:1rem 1.5rem; }
.activity-item { display:flex; align-items:flex-start; gap:0.8rem; padding:0.7rem 0; border-bottom:1px solid rgba(0,170,255,0.08); animation:fade-in 0.3s ease; }
@keyframes fade-in { from{opacity:0;} to{opacity:1;} }
.activity-item:last-child { border-bottom:none; }
.act-status { width:10px; height:10px; min-width:10px; border:2px solid var(--blue-cyan); margin-top:4px; cursor:pointer; transition:all 0.2s; clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); }
.act-status.entregue { background:var(--blue-cyan); box-shadow:0 0 8px var(--blue-cyan); }
.act-status.cancelada { background:var(--accent-red); border-color:var(--accent-red); }
.act-info { flex:1; min-width:0; }
.act-title { font-size:13px; font-weight:600; letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; transition:color 0.2s; }
.act-title:hover { color:var(--blue-cyan); }
.act-title.entregue { text-decoration:line-through; color:var(--grey); }
.act-title.cancelada { text-decoration:line-through; color:var(--accent-red); opacity:0.6; }
.act-meta { display:flex; gap:0.5rem; margin-top:3px; flex-wrap:wrap; align-items:center; }
.act-tag { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1px; padding:1px 6px; border:1px solid; }
.act-tag.avaliativa { color:#ffcc00; border-color:rgba(255,204,0,0.4); background:rgba(255,204,0,0.08); }
.act-tag.comum { color:var(--blue-cyan); border-color:rgba(0,200,255,0.3); background:rgba(0,200,255,0.05); }
.act-tag.apresentacao { color:var(--accent-pink); border-color:rgba(255,136,170,0.4); background:rgba(255,136,170,0.08); }
.act-date { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--grey); }
.act-actions { display:flex; gap:0.3rem; }
.act-btn { background:none; border:1px solid; cursor:pointer; font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1px; padding:3px 6px; transition:all 0.2s; text-transform:uppercase; }
.act-btn.entregar { color:var(--blue-cyan); border-color:rgba(0,200,255,0.4); }
.act-btn.entregar:hover { background:rgba(0,200,255,0.15); }
.act-btn.cancelar { color:var(--accent-red); border-color:rgba(255,51,68,0.4); }
.act-btn.cancelar:hover { background:rgba(255,51,68,0.15); }
.act-btn.resumo { color:var(--accent-pink); border-color:rgba(255,136,170,0.4); }
.act-btn.resumo:hover { background:rgba(255,136,170,0.1); }
.add-btn { display:flex; align-items:center; gap:0.5rem; margin-top:1rem; background:none; border:1px dashed rgba(0,170,255,0.3); width:100%; padding:0.6rem; cursor:pointer; color:var(--grey); font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:600; letter-spacing:2px; text-transform:uppercase; transition:all 0.2s; justify-content:center; }
.add-btn:hover { border-color:var(--blue-cyan); color:var(--blue-cyan); background:rgba(0,170,255,0.05); }
.modal-overlay { position:fixed; inset:0; z-index:1000; background:rgba(0,4,16,0.9); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; padding:1rem; }
.modal-overlay.hidden { display:none; }
.modal { background:linear-gradient(135deg,#001133,#000820); border:1px solid var(--blue-cyan); width:100%; max-width:520px; clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px)); animation:modal-in 0.25s ease; box-shadow:0 0 60px rgba(0,100,255,0.3); max-height:90vh; overflow-y:auto; }
@keyframes modal-in { from{transform:scale(0.95) translateY(-16px);opacity:0;} to{transform:scale(1) translateY(0);opacity:1;} }
.modal-header { padding:1.5rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:linear-gradient(90deg,rgba(0,50,150,0.4),transparent); }
.modal-title { font-family:'Orbitron',sans-serif; font-size:13px; font-weight:700; letter-spacing:3px; color:var(--blue-cyan); }
.modal-close { background:none; border:1px solid rgba(255,51,68,0.4); color:var(--accent-red); width:28px; height:28px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
.modal-close:hover { background:rgba(255,51,68,0.15); }
.modal-body { padding:1.5rem; }
.form-group { margin-bottom:1.2rem; }
.form-label { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--grey); text-transform:uppercase; display:block; margin-bottom:6px; }
.form-input,.form-select,.form-textarea { width:100%; background:rgba(0,17,51,0.8); border:1px solid var(--border); color:var(--white); font-family:'Rajdhani',sans-serif; font-size:14px; padding:0.6rem 0.8rem; outline:none; transition:border-color 0.2s; }
.form-input:focus,.form-select:focus,.form-textarea:focus { border-color:var(--blue-cyan); }
.form-select option { background:#001133; }
.form-textarea { resize:vertical; min-height:80px; line-height:1.6; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.modal-footer { padding:1rem 1.5rem; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:0.8rem; }
.btn-primary { background:var(--blue-bright); border:none; color:#fff; font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; padding:0.7rem 1.5rem; cursor:pointer; transition:all 0.2s; clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); }
.btn-primary:hover { background:var(--blue-cyan); box-shadow:0 0 20px rgba(0,200,255,0.4); }
.btn-secondary { background:none; border:1px solid var(--border); color:var(--grey); font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:600; letter-spacing:2px; text-transform:uppercase; padding:0.7rem 1.2rem; cursor:pointer; transition:all 0.2s; }
.btn-secondary:hover { border-color:var(--grey); color:var(--white); }
.resumo-input { background:rgba(0,17,51,0.8); border:1px solid var(--border); color:var(--white); font-family:'Rajdhani',sans-serif; font-size:13px; padding:0.8rem; width:100%; outline:none; resize:vertical; min-height:100px; transition:border-color 0.2s; line-height:1.7; }
.resumo-input:focus { border-color:var(--blue-cyan); }
.empty-state { text-align:center; padding:1.5rem; color:var(--grey); font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:2px; }
.toast-container { position:fixed; bottom:2rem; right:2rem; z-index:9999; display:flex; flex-direction:column; gap:0.5rem; }
.toast { background:rgba(0,17,51,0.97); border-left:3px solid var(--blue-cyan); padding:0.8rem 1.2rem; backdrop-filter:blur(12px); font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:1px; animation:toast-in 0.3s ease; min-width:260px; transition:opacity 0.5s; }
.toast.success { border-left-color:var(--blue-cyan); color:var(--blue-cyan); }
.toast.error { border-left-color:var(--accent-red); color:var(--accent-red); }
.toast.info { border-left-color:var(--accent-pink); color:var(--accent-pink); }
@keyframes toast-in { from{transform:translateX(100%);opacity:0;} to{transform:translateX(0);opacity:1;} }
.page-view { display:none; }
.page-view.active { display:block; }
.lista-table { width:100%; border-collapse:collapse; font-size:13px; }
.lista-table th { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--grey); text-align:left; padding:0.8rem 1rem; border-bottom:1px solid var(--border); text-transform:uppercase; background:rgba(0,17,51,0.5); }
.lista-table td { padding:0.8rem 1rem; border-bottom:1px solid rgba(0,170,255,0.07); vertical-align:middle; }
.lista-table tr:hover td { background:rgba(0,100,255,0.05); }
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(0,170,255,0.3); border-radius:2px; }
@media(max-width:768px) { .stats-bar{grid-template-columns:1fr 1fr;} .subjects-grid{grid-template-columns:1fr;} .form-row{grid-template-columns:1fr;} main{padding:1rem;} }
</style>
</head>

<div class="modal-overlay hidden" id="addModal">
  <div class="modal">
    <div class="modal-header"><span class="modal-title">// NOVA ATIVIDADE</span><button class="modal-close" onclick="closeModal('addModal')">&#x2715;</button></div>

      <div class="form-group"><label class="form-label">Título da Atividade</label><input class="form-input" id="inp-titulo" placeholder="Ex: Trabalho sobre SQL..."></div>

    <div class="modal-header"><span class="modal-title" id="resumo-modal-title">// RESUMO</span><button class="modal-close" onclick="closeModal('resumoModal')">&#x2715;</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Atividade</label><div id="resumo-act-name" style="font-weight:700;color:var(--blue-cyan);letter-spacing:2px;margin-bottom:0.5rem;font-size:15px;"></div></div>
      <div class="form-group"><label class="form-label">Matéria</label><div id="resumo-act-mat" style="color:var(--grey);font-family:Share Tech Mono,monospace;font-size:11px;margin-bottom:0.3rem;"></div></div>
      <div class="form-group"><label class="form-label">Resumo / Notas</label><textarea class="resumo-input" id="resumo-textarea" placeholder="Adicione suas notas sobre esta atividade..."></textarea></div>
    </div>
    <div class="modal-footer"><button class="btn-secondary" onclick="closeModal('resumoModal')">FECHAR</button><button class="btn-primary" onclick="saveResumo()">SALVAR</button></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const MATERIAS = [
  {id:'bd',name:'Banco de Dados',code:'BD-01'},
  {id:'prog',name:'Programação',code:'PRG-02'},
  {id:'web',name:'Tec-Web',code:'WEB-03'},
  {id:'fil',name:'Filosofia',code:'FIL-04'},
  {id:'soc',name:'Sociologia',code:'SOC-05'},
  {id:'pv',name:'Projeto de Vida',code:'PV-06'},
  {id:'mat',name:'Matemática',code:'MAT-07'},
  {id:'mata',name:'Matemática Aplicada',code:'MATA-08'},
  {id:'art',name:'Artes',code:'ART-09'},
  {id:'amb',name:'Educação Ambiental',code:'AMB-10'},
  {id:'hist',name:'História',code:'HST-11'},
  {id:'geo',name:'Geografia',code:'GEO-12'},
  {id:'qui',name:'Química',code:'QUI-13'},
  {id:'bio',name:'Biologia',code:'BIO-14'},
  {id:'fis',name:'Física',code:'FIS-15'},
];
let activities = JSON.parse(localStorage.getItem('p3r_acts')||'[]');
let currentFilter = 'all';
let editingResumoId = null;
let presetMateria = null;

function save(){localStorage.setItem('p3r_acts',JSON.stringify(activities));render();updateCounts();}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function openAddModal(mid){
  presetMateria=mid;
  const sel=document.getElementById('inp-materia');
  sel.innerHTML=MATERIAS.map(m=>'<option value="'+m.id+'"'+(m.id===mid?' selected':'')+'>'+m.name+'</option>').join('');
  ['titulo','valor','resumo'].forEach(k=>document.getElementById('inp-'+k).value='');
  document.getElementById('inp-tipo').value='comum';
  document.getElementById('inp-data').value='';
  document.getElementById('addModal').classList.remove('hidden');
}
function closeModal(id){document.getElementById(id).classList.add('hidden');}

function saveActivity(){
  const t=document.getElementById('inp-titulo').value.trim();
  if(!t){toast('Informe o título','error');return;}
  activities.push({id:genId(),titulo:t,materia:document.getElementById('inp-materia').value,tipo:document.getElementById('inp-tipo').value,data:document.getElementById('inp-data').value,valor:document.getElementById('inp-valor').value,resumo:document.getElementById('inp-resumo').value.trim(),status:'pendente',createdAt:Date.now()});
  save();closeModal('addModal');toast('Atividade registrada!','success');
}

function openResumoModal(id){
  const act=activities.find(a=>a.id===id);if(!act)return;
  const mat=MATERIAS.find(m=>m.id===act.materia);
  editingResumoId=id;
  document.getElementById('resumo-modal-title').textContent='// RESUMO — '+(mat?mat.code:act.materia);
  document.getElementById('resumo-act-name').textContent=act.titulo;
  document.getElementById('resumo-act-mat').textContent=mat?mat.name:act.materia;
  document.getElementById('resumo-textarea').value=act.resumo||'';
  document.getElementById('resumoModal').classList.remove('hidden');
}
function saveResumo(){
  const act=activities.find(a=>a.id===editingResumoId);if(!act)return;
  act.resumo=document.getElementById('resumo-textarea').value;
  save();closeModal('resumoModal');toast('Resumo salvo!','info');
}

function markEntregue(id){
  const act=activities.find(a=>a.id===id);if(!act)return;
  act.status=act.status==='entregue'?'pendente':'entregue';
  save();toast(act.status==='entregue'?'✓ Entregue!':'↩ Reaberta','success');
}
function markCancelada(id){
  const act=activities.find(a=>a.id===id);if(!act)return;
  if(act.status==='cancelada'){act.status='pendente';save();toast('↩ Restaurada','info');return;}
  if(!confirm('Cancelar esta atividade?'))return;
  act.status='cancelada';save();toast('✕ Cancelada','error');
}

function filterCategory(cat){
  currentFilter=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
  render();
}

function getFiltered(){return currentFilter==='all'?activities:activities.filter(a=>a.tipo===currentFilter);}

function actHTML(act){
  const typeLabel=act.tipo==='avaliativa'?'AVAL':act.tipo==='apresentacao'?'APRES':'COM';
  return '<div class="activity-item"><div class="act-status '+act.status+'" onclick="markEntregue(\''+ act.id +'\')" title="Clique para marcar entrega"></div><div class="act-info"><div class="act-title '+act.status+'" onclick="openResumoModal(\''+ act.id +'\')">'+act.titulo+'</div><div class="act-meta"><span class="act-tag '+act.tipo+'">'+typeLabel+'</span>'+(act.data?'<span class="act-date">'+fmtDate(act.data)+'</span>':'')+'</div></div><div class="act-actions"><button class="act-btn entregar" onclick="markEntregue(\''+ act.id +'\')" title="Entregar">&#10003;</button><button class="act-btn resumo" onclick="openResumoModal(\''+ act.id +'\')" title="Resumo">&#8801;</button><button class="act-btn cancelar" onclick="markCancelada(\''+ act.id +'\')" title="Cancelar">&#x2715;</button></div></div>';
}

function renderCard(mat,acts,showAdd){
  const filtered=acts.filter(a=>currentFilter==='all'||a.tipo===currentFilter);
  const pending=filtered.filter(a=>a.status==='pendente').length;
  return '<div class="subject-card"><div class="subject-header"><div><div class="subject-code">'+mat.code+'</div><div class="subject-name">'+mat.name+'</div></div><div class="subject-count">'+(pending>0?pending+' PEND':filtered.length+' TOTAL')+'</div></div><div class="subject-body">'+(filtered.length===0?'<div class="empty-state">// SEM ATIVIDADES</div>':filtered.map(a=>actHTML(a)).join(''))+(showAdd?'<button class="add-btn" onclick="openAddModal(\''+ mat.id +'\')">+ ADICIONAR ATIVIDADE</button>':'')+'</div></div>';
}

function renderDashboard(){
  const filtered=getFiltered();
  const withActs=MATERIAS.filter(m=>filtered.some(a=>a.materia===m.id));
  const without=MATERIAS.filter(m=>!filtered.some(a=>a.materia===m.id)).slice(0,4);
  document.getElementById('dashboard-grid').innerHTML=[...withActs,...without].map(m=>renderCard(m,filtered.filter(a=>a.materia===m.id),true)).join('');
}
function renderMaterias(){
  const filtered=getFiltered();
  document.getElementById('materias-grid').innerHTML=MATERIAS.map(m=>renderCard(m,filtered.filter(a=>a.materia===m.id),true)).join('');
}
function renderTodas(){
  const filtered=getFiltered().slice().sort((a,b)=>b.createdAt-a.createdAt);
  const tbody=document.getElementById('todas-tbody');
  if(!filtered.length){tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--grey);font-family:monospace;font-size:11px;">// NENHUMA ATIVIDADE REGISTRADA</td></tr>';return;}
  tbody.innerHTML=filtered.map(act=>{
    const mat=MATERIAS.find(m=>m.id===act.materia);
    const sc=act.status==='entregue'?'#00ff88':act.status==='cancelada'?'var(--accent-red)':'#ffcc00';
    const sl=act.status==='entregue'?'ENTREGUE':act.status==='cancelada'?'CANCELADA':'PENDENTE';
    return '<tr><td><span style="font-family:monospace;font-size:10px;color:'+sc+';letter-spacing:1px;">'+sl+'</span></td><td style="font-weight:600;">'+act.titulo+'</td><td style="font-family:monospace;font-size:10px;color:var(--blue-cyan);">'+( mat?mat.code:act.materia)+'</td><td><span class="act-tag '+act.tipo+'" style="font-size:9px;">'+act.tipo.toUpperCase()+'</span></td><td style="font-family:monospace;font-size:10px;color:var(--grey);">'+( act.data?fmtDate(act.data):'—')+'</td><td>'+(act.resumo?'<span style="color:var(--blue-cyan);font-size:11px;cursor:pointer;" onclick="openResumoModal(\''+ act.id +'\')">VER &#8801;</span>':'<span style="color:var(--grey);font-size:10px;">—</span>')+'</td><td><div style="display:flex;gap:0.3rem;"><button class="act-btn entregar" onclick="markEntregue(\''+ act.id +'\')">&#10003;</button><button class="act-btn resumo" onclick="openResumoModal(\''+ act.id +'\')">&#8801;</button><button class="act-btn cancelar" onclick="markCancelada(\''+ act.id +'\')">&#x2715;</button></div></td></tr>';
  }).join('');
}

function updateStats(){
  document.getElementById('stat-total').textContent=activities.length;
  document.getElementById('stat-pendentes').textContent=activities.filter(a=>a.status==='pendente').length;
  document.getElementById('stat-entregues').textContent=activities.filter(a=>a.status==='entregue').length;
  document.getElementById('stat-canceladas').textContent=activities.filter(a=>a.status==='cancelada').length;
}
function updateCounts(){
  ['avaliativa','comum','apresentacao'].forEach(cat=>{
    const el=document.getElementById('cnt-'+cat);
    if(el){const n=activities.filter(a=>a.tipo===cat&&a.status==='pendente').length;el.textContent=n||'';}
  });
}
function render(){renderDashboard();renderMaterias();renderTodas();updateStats();}

function showPage(page){
  document.querySelectorAll('.page-view').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.main-nav button').forEach((b,i)=>{
    b.classList.toggle('active',['dashboard','materias','todas'][i]===page);
  });
  const idx={dashboard:0,materias:1,todas:2}[page]||0;
  document.querySelectorAll('.bg-img').forEach((el,i)=>{el.style.opacity=i===idx?'0.12':'0';});
  render();
}

function toast(msg,type){
  const c=document.getElementById('toastContainer');
  const t=document.createElement('div');
  t.className='toast '+type; t.textContent=msg; c.appendChild(t);
  setTimeout(()=>t.style.opacity='0',2500);
  setTimeout(()=>t.remove(),3000);
}
function fmtDate(d){if(!d)return'—';const[y,m,day]=d.split('-');return day+'/'+m+'/'+y;}

document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.add('hidden');}));

document.getElementById('currentDate').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short'}).toUpperCase()+' // '+new Date().toLocaleDateString('pt-BR');

render();updateCounts();
</script>
</body>
</html>
